<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#0d0d10"/>

  <!-- Subtle inner glow ring on background (depth) -->
  <rect width="128" height="128" rx="24" fill="none" stroke="#4f6ef7" stroke-width="1" opacity="0.12"/>

  <!-- Connector lines — drawn behind nodes, edge-to-edge -->
  <!-- Root (64,35,r16) → Left child (33,90,r13) -->
  <!-- unit vec ≈ (-0.503, 0.864); root edge (55.9,48.8); child edge (39.5,78.8) -->
  <line x1="56" y1="49" x2="40" y2="79"
        stroke="#4f6ef7" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Root (64,35,r16) → Right child (95,90,r13) -->
  <!-- unit vec ≈ (0.503, 0.864); root edge (72.1,48.8); child edge (88.5,78.8) -->
  <line x1="72" y1="49" x2="88" y2="79"
        stroke="#4f6ef7" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Root node — indigo/periwinkle, slightly larger -->
  <circle cx="64" cy="35" r="16" fill="#4f6ef7"/>
  <!-- Subtle highlight -->
  <circle cx="58" cy="29" r="5" fill="white" opacity="0.15"/>

  <!-- Left child — emerald green -->
  <circle cx="33" cy="90" r="13" fill="#34d399"/>
  <circle cx="28" cy="85" r="4" fill="white" opacity="0.15"/>

  <!-- Right child — lighter blue -->
  <circle cx="95" cy="90" r="13" fill="#7aa2f7"/>
  <circle cx="90" cy="85" r="4" fill="white" opacity="0.15"/>

  <!-- Three small horizontal dashes at the bottom — represent "text/markdown source" -->
  <rect x="24" y="112" width="18" height="2.5" rx="1.25" fill="#34d399" opacity="0.55"/>
  <rect x="55" y="112" width="18" height="2.5" rx="1.25" fill="#4f6ef7" opacity="0.55"/>
  <rect x="86" y="112" width="18" height="2.5" rx="1.25" fill="#7aa2f7" opacity="0.55"/>

</svg>

<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded dark backdrop so the icon reads cleanly on both light and dark browser chrome -->
  <rect width="32" height="32" rx="7" fill="#0d0d10"/>
  <!-- Tree edges (parent → two children) -->
  <line x1="14"   y1="11"   x2="10.5" y2="20" stroke="#3a3a48" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="18"   y1="11"   x2="21.5" y2="20" stroke="#3a3a48" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Three nodes: parent (accent blue), children (lighter blue + green) -->
  <circle cx="16" cy="9"  r="4" fill="#4f6ef7"/>
  <circle cx="9"  cy="22" r="4" fill="#7aa2f7"/>
  <circle cx="23" cy="22" r="4" fill="#34d399"/>
</svg>
